<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ZORO Chat</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020914;
  color:#e8f7ff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.chat-page{
  width:100%;
  max-width:520px;
  height:100dvh;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  padding:10px 12px;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(0,110,255,.09),
      transparent 30%
    ),
    #020914;
}

/* HEADER */

.chat-header{
  flex-shrink:0;

  height:58px;

  display:flex;
  align-items:center;

  position:relative;

  border-bottom:1px solid rgba(0,124,255,.35);
}

.back{
  width:40px;
  height:40px;

  border-radius:50%;

  border:1px solid #087cff;

  background:#03172a;

  color:#00dfff;

  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.zoro-title{
  flex:1;

  text-align:center;

  margin-right:40px;
}

.zoro-name{
  font-size:19px;
  font-weight:bold;

  letter-spacing:4px;

  color:#e1faff;

  text-shadow:
    0 0 8px #00bfff,
    0 0 18px #007cff;
}

.status{
  margin-top:3px;

  font-size:8px;

  letter-spacing:2px;

  color:#00f3a5;
}

/* CHAT AREA */

.messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:14px 3px 12px;

  display:flex;
  flex-direction:column;

  gap:12px;

  scrollbar-width:none;
}

.messages::-webkit-scrollbar{
  display:none;
}

.msg{
  display:flex;

  align-items:flex-end;

  gap:7px;

  max-width:84%;
}

.msg.you{
  align-self:flex-end;

  flex-direction:row-reverse;
}

.avatar{
  flex-shrink:0;

  width:31px;
  height:31px;

  border-radius:50%;

  border:1px solid #00bfff;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#03172a;

  color:#00eaff;

  font-size:12px;

  box-shadow:
    0 0 9px rgba(0,145,255,.4);
}

.msg.you .avatar{
  border-color:#087cff;
}

.bubble{
  padding:9px 11px;

  border-radius:13px;

  border:1px solid #086bd2;

  background:
    linear-gradient(
      135deg,
      rgba(5,38,76,.9),
      rgba(3,22,43,.92)
    );

  box-shadow:
    0 0 8px rgba(0,100,255,.08);
}

.msg.you .bubble{
  border-color:#087cff;
}

.sender{
  font-size:9px;

  font-weight:bold;

  color:#00cfff;

  margin-bottom:4px;
}

.message-text{
  font-size:12px;

  line-height:1.4;

  color:#e5f5ff;

  word-break:break-word;
}

.message-time{
  text-align:right;

  margin-top:4px;

  font-size:7px;

  color:#6f9fc4;
}

/* INPUT */

.composer{
  flex-shrink:0;

  min-height:60px;

  display:flex;
  align-items:center;

  gap:7px;

  padding-top:7px;
}

.input-box{
  flex:1;

  min-width:0;

  height:48px;

  display:flex;
  align-items:center;

  border:1px solid #087cff;

  border-radius:25px;

  background:#031426;

  box-shadow:
    inset 0 0 12px rgba(0,100,255,.08);
}

.input{
  width:100%;

  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:#e8f7ff;

  padding:0 16px;

  font-size:12px;
}

.input::placeholder{
  color:#6f9fc4;
}

.mic-button,
.send-button{
  flex-shrink:0;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #087cff;

  background:#03172a;

  color:#00dfff;

  font-size:20px;

  box-shadow:
    0 0 10px rgba(0,120,255,.15);
}

.send-button{
  background:
    radial-gradient(
      circle,
      #07396a,
      #021326
    );
}

/* SMALL PHONES */

@media(max-height:700px){

  .chat-page{
    padding-top:7px;
  }

  .chat-header{
    height:52px;
  }

  .messages{
    padding-top:10px;
    gap:9px;
  }

  .bubble{
    padding:7px 9px;
  }

  .message-text{
    font-size:11px;
  }

  .composer{
    min-height:56px;
  }

  .input-box,
  .mic-button,
  .send-button{
    height:44px;
  }

  .mic-button,
  .send-button{
    width:44px;
  }
}

</style>
</head>

<body>

<div class="chat-page">

  <!-- HEADER -->

  <header class="chat-header">

    <button class="back" onclick="goHome()">‹</button>

    <div class="zoro-title">

      <div class="zoro-name">ZORO</div>

      <div class="status">
        ● AI ONLINE
      </div>

    </div>

  </header>


  <!-- MESSAGES -->

  <main class="messages" id="messages">

    <!--
      Actual conversation messages will be added
      here later using chat.js.
    -->

  </main>


  <!-- INPUT -->

  <form class="composer" id="chatForm">

    <div class="input-box">

      <input
        id="messageInput"
        class="input"
        type="text"
        autocomplete="off"
        placeholder="message zoro..."
      >

    </div>

    <button
      type="button"
      class="mic-button"
      id="chatMic"
      aria-label="voice">
      🎙
    </button>

    <button
      type="submit"
      class="send-button"
      aria-label="send">
      ➤
    </button>

  </form>

</div>


<script>

function goHome(){
  window.location.href="/";
}

</script>

<script src="/js/chat.js"></script>

</body>
</html>
